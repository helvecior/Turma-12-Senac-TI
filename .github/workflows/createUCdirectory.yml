name: Criar pasta de tarefa

on:
  workflow_dispatch:
    inputs:
          uc:
        description: "Em qual UC deseja criar a tarefa?"
        type: choice
        required: true
        options:
          - UC01
          - UC02
          - UC03
          - UC04
          - UC05
          - UC06
          - UC07
          - UC08
          - UC09
          - UC10
          - UC11
          - UC12
          - UC13
          - UC14
          - UC15
          - UC16
        numero:
        description: "Número da tarefa (ex.: 03)"
        type: string
        required: true

permissions:
  contents: write

jobs:
  criar-tarefa:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6

      - name: Copiar o modelo e publicar a tarefa
        shell: bash
        env:
          UC: ${{ inputs.uc }}
          NUMERO: ${{ inputs.numero }}
        run: |
          if [[ ! "$NUMERO" =~ ^[0-9]{2}$ || "$NUMERO" == "00" ]]; then
            echo "Informe um número de 01 a 99, usando dois dígitos."
            exit 1
          fi

          destino="$UC/Tarefa-$NUMERO"

          if [[ -e "$destino" ]]; then
            echo "A pasta $destino já existe."
            exit 1
          fi

          cp -r -- Modelo-Tarefa "$destino"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$destino"
          git commit -m "Cria a tarefa $NUMERO na $UC"
          git push
